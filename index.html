<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beam FEM Deflection Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header><div><p class="eyebrow">Structural Engineering Portfolio Project</p><h1>Simply Supported Beam FEM</h1></div><span class="badge">Euler-Bernoulli</span></header>
    <section class="dashboard">
      <aside class="panel controls">
        <h2>Beam properties</h2>
        <label>Length <output id="lengthOut">6</output> m</label><input id="length" type="range" min="2" max="12" step="0.1" value="6" />
        <label>Distributed load <output id="loadOut">18</output> kN/m</label><input id="load" type="range" min="0" max="60" step="1" value="18" />
        <label>Young's modulus <output id="modulusOut">200</output> GPa</label><input id="modulus" type="range" min="70" max="210" step="10" value="200" />
        <label>Moment of inertia <output id="inertiaOut">85</output> ×10⁶ mm⁴</label><input id="inertia" type="range" min="20" max="200" step="5" value="85" />
        <label>Elements <output id="elementsOut">20</output></label><input id="elements" type="range" min="4" max="40" step="2" value="20" />
        <div class="metric-grid">
          <article><span>Max deflection</span><strong id="deflection">--</strong></article>
          <article><span>Max moment</span><strong id="moment">--</strong></article>
          <article><span>Max shear</span><strong id="shear">--</strong></article>
          <article><span>Tip rotation</span><strong id="rotation">--</strong></article>
        </div>
      </aside>
      <section class="panel plots">
        <canvas id="deflectionCanvas" width="860" height="250" aria-label="Beam deflection plot"></canvas>
        <canvas id="momentCanvas" width="860" height="250" aria-label="Bending moment plot"></canvas>
      </section>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
